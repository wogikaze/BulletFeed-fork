name: Android quality

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend acceptance dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Check Kotlin formatting, Android lint and unit tests
        run: ./gradlew ktlintCheck lint testDebugUnitTest

      - name: Run M7 clean-room Android release-client acceptance
        run: |
          # Lifecycle evidence remains partial in CI; no device-data wipe is allowed.
          python backend/scripts/run_clean_room_backend_acceptance.py \
            --android-release-client \
            --run-android-lifecycle \
            --output "$RUNNER_TEMP/m7-clean-room-android.json"

      - name: Build M7 RC evidence with Android report
        run: |
          python backend/scripts/build_rc_evidence_report.py \
            --check \
            --android-report "$RUNNER_TEMP/m7-clean-room-android.json" \
            --output "$RUNNER_TEMP/m7-rc-evidence-with-android.json"

      - name: Upload Android and M7 RC evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bulletfeed-m7-clean-room-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m7-clean-room-android.json
            ${{ runner.temp }}/m7-rc-evidence-with-android.json
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Branch protection still requires this exact check name.
  lint-and-format-check:
    name: Lint and format check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Report required status
        run: echo "Lint, format and unit tests passed"
