name: SQLite capacity boundary

on:
  pull_request:
    paths:
      - "backend/scripts/benchmark_capacity.py"
      - "backend/scripts/benchmark_capacity_sweep.py"
      - "backend/scripts/benchmark_sqlite_concurrency.py"
      - "backend/app/services/event_coreference.py"
      - "backend/app/services/source_ingestion.py"
      - "backend/app/stores/feed_store.py"
      - "backend/app/sync_worker.py"
      - "docs/sqlite-storage-boundary.md"
      - ".github/workflows/sqlite-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Validate SQLite single-writer boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install hash-locked backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip check

      - name: Sweep through the imported 500k target
        run: |
          python backend/scripts/benchmark_capacity_sweep.py \
            --sizes 100000 250000 500000 \
            --stop-on-boundary \
            --directory "$RUNNER_TEMP/sqlite-sweep" \
            --output "$RUNNER_TEMP/sqlite-boundary-sweep.json"
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["RUNNER_TEMP"], "sqlite-boundary-sweep.json")
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)
          if report["completed_sizes"][-1] != 500000:
              raise SystemExit("SQLite scale threshold breached before the 500k port target")
          if report["first_boundary_observations"] is not None:
              raise SystemExit(
                  f"unexpected scale threshold at {report['first_boundary_observations']} observations"
              )
          PY

      - name: Measure concurrent API-store and worker contention at 500k
        run: |
          python backend/scripts/benchmark_sqlite_concurrency.py \
            --observations 500000 \
            --assert-safe \
            --database "$RUNNER_TEMP/sqlite-contention.db" \
            --output "$RUNNER_TEMP/sqlite-contention.json"

      - name: Upload measured boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlite-boundary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sqlite-boundary-sweep.json
            ${{ runner.temp }}/sqlite-contention.json
          if-no-files-found: ignore
          retention-days: 7
