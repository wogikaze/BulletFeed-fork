name: Repair inherited EOF newlines

on:
  push:
    branches:
      - port/missing-original-work

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: port/missing-original-work
          fetch-depth: 0

      - name: Append missing final newlines only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("app/src/main/java/com/bulletfeed/app/ui/BulletFeedApp.kt"),
              Path("app/src/main/java/com/bulletfeed/app/ui/BulletFeedViewModel.kt"),
              Path("app/src/main/java/com/bulletfeed/app/ui/onboarding/OnboardingScreen.kt"),
              Path("app/src/test/java/com/bulletfeed/app/SiteFeedDiscoverSettingsTest.kt"),
          ]
          for path in paths:
              data = path.read_bytes()
              if data and not data.endswith(b"\n"):
                  path.write_bytes(data + b"\n")
          PY

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "All target files already end with a newline."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/bulletfeed/app/ui/BulletFeedApp.kt \
            app/src/main/java/com/bulletfeed/app/ui/BulletFeedViewModel.kt \
            app/src/main/java/com/bulletfeed/app/ui/onboarding/OnboardingScreen.kt \
            app/src/test/java/com/bulletfeed/app/SiteFeedDiscoverSettingsTest.kt
          git commit -m "style: restore final newlines inherited from #467"
          git push origin HEAD:port/missing-original-work
