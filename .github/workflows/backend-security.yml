name: Backend security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency and static security audit
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      SEMGREP_SEND_METRICS: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install hash-locked audit environment
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit locked dependencies
        run: pip-audit --require-hashes -r backend/requirements.lock

      - name: Run Bandit with reviewed waivers
        run: python backend/scripts/run_bandit_gate.py

      - name: Run Semgrep security audit
        run: semgrep scan --config p/security-audit --error --metrics=off backend/app
