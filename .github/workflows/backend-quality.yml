name: Backend quality

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install hash-locked backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify lock satisfies project metadata
        run: python backend/scripts/verify_locked_environment.py

      - name: Enforce blind Gold isolation
        run: python backend/scripts/check_blind_gold_leakage.py

      - name: Delta-06 asymmetric threshold calibration gate
        run: python backend/scripts/run_delta_calibration.py --split blind --check

      - name: Run Ruff
        run: ruff check backend

      - name: Run backend tests
        run: pytest backend -q --tb=short
