name: Dependency lock

on:
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/requirements.lock"
      - "backend/scripts/verify_locked_environment.py"
      - ".github/workflows/dependency-lock.yml"
  push:
    branches: [main, completion-pr]

permissions:
  contents: read

concurrency:
  group: dependency-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Verify hash-locked Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Verify hash-only install
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify lock satisfies project metadata
        run: python backend/scripts/verify_locked_environment.py
