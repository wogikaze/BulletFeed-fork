name: M5 host recovery drill

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "Per-readiness timeout in seconds"
        required: false
        default: "300"
        type: string

permissions:
  contents: read

jobs:
  host-recovery:
    name: Docker API and worker restart drill
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install hash-locked backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Run M5 Docker host recovery drill
        run: |
          python backend/scripts/run_host_recovery_drill.py \
            --timeout "${{ inputs.timeout }}" \
            --output "$RUNNER_TEMP/m5-host-recovery.json"

      - name: Upload M5 host recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bulletfeed-m5-host-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/m5-host-recovery.json
          if-no-files-found: warn
