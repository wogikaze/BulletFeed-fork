[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "bulletfeed-backend"
version = "0.1.0"
description = "Optional FastAPI prototype for the BulletFeed Android client"
requires-python = ">=3.11"
dependencies = [
    "bleach>=6.2,<7",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "feedparser>=6.0.11,<7",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
namespaces = false
